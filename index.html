<html >
    <head>
        <title>BEAT SHOOTER</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>BEAT SHOOTER</h1>
        <p>Feel the beat, shoot the rhythm!</p>
        <canvas id="game"></canvas>
        
<div id="start-screen">
    <h1>BEATSOUND</h1>
    <p>RUN TO THE BEAT</p>

    <button id="play-btn">PLAY</button>

    <div class="controls">
        <h2>CONTROLS</h2>
        <p><span>SPACE</span> — Jump</p>
        <p><span>Double Space</span> — Double jump</p>
        <p><span>R</span> — Restart</p>
    </div>
</div>

        <script src="game.js"></script>
    </body>
</html>
